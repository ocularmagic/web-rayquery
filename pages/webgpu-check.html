<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WebGPU check</title>
<style>
  :root { color-scheme: light dark; --bg: #fafafa; --fg: #1a1a1a; --ok: #1b7f3b; --bad: #b3261e; }
  @media (prefers-color-scheme: dark) { :root { --bg: #161616; --fg: #e8e8e8; --ok: #6ccf8e; --bad: #f2827a; } }
  body { margin: 0; padding: 16px; background: var(--bg); color: var(--fg); font: 15px/1.5 system-ui, sans-serif; }
  pre { white-space: pre-wrap; overflow-wrap: anywhere; font: 13px/1.45 ui-monospace, Consolas, monospace; }
  .ok { color: var(--ok); } .bad { color: var(--bad); }
</style>
</head>
<body>
<h1>WebGPU check</h1>
<p id="status">Running...</p>
<pre id="out"></pre>
<script type="module">
// Plain WebGPU smoke test: adapter info, features, and a compute shader round trip.
// Each line is also logged with a "WEBGPU-CHECK" prefix so a terminal can read it
// (Firefox: set devtools.console.stdout.content=true).
const out = document.getElementById('out');
const status = document.getElementById('status');
const log = (line) => { out.textContent += line + '\n'; console.log('WEBGPU-CHECK ' + line); };
const finish = (ok, msg) => {
  status.textContent = msg;
  status.className = ok ? 'ok' : 'bad';
  log('RESULT ' + (ok ? 'PASS' : 'FAIL') + ' ' + msg);
};

try {
  log('userAgent: ' + navigator.userAgent);
  if (!navigator.gpu) throw new Error('navigator.gpu is missing');
  const adapter = await navigator.gpu.requestAdapter({ powerPreference: 'high-performance' });
  if (!adapter) throw new Error('requestAdapter returned null');
  const info = adapter.info || {};
  log(`adapter: vendor=${info.vendor} architecture=${info.architecture} device=${info.device} description=${info.description} fallback=${adapter.isFallbackAdapter ?? info.isFallbackAdapter}`);
  log('features: ' + [...adapter.features].sort().join(', '));
  const l = adapter.limits;
  log(`limits: maxBufferSize=${l.maxBufferSize} maxStorageBufferBindingSize=${l.maxStorageBufferBindingSize} maxComputeInvocationsPerWorkgroup=${l.maxComputeInvocationsPerWorkgroup}`);
  log('wgslLanguageFeatures: ' + [...(navigator.gpu.wgslLanguageFeatures || [])].sort().join(', '));

  const device = await adapter.requestDevice();
  device.pushErrorScope('validation');
  const module = device.createShaderModule({ code: `
    @group(0) @binding(0) var<storage, read_write> data: array<f32>;
    @compute @workgroup_size(64)
    fn main(@builtin(global_invocation_id) id: vec3<u32>) {
      if (id.x < arrayLength(&data)) { data[id.x] = data[id.x] * 2.0 + 1.0; }
    }` });
  const input = new Float32Array(256).map((_, i) => i * 0.5);
  const buf = device.createBuffer({ size: input.byteLength, usage: GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_SRC | GPUBufferUsage.COPY_DST });
  device.queue.writeBuffer(buf, 0, input);
  const readback = device.createBuffer({ size: input.byteLength, usage: GPUBufferUsage.MAP_READ | GPUBufferUsage.COPY_DST });
  const pipeline = device.createComputePipeline({ layout: 'auto', compute: { module, entryPoint: 'main' } });
  const bg = device.createBindGroup({ layout: pipeline.getBindGroupLayout(0), entries: [{ binding: 0, resource: { buffer: buf } }] });
  const enc = device.createCommandEncoder();
  const pass = enc.beginComputePass();
  pass.setPipeline(pipeline);
  pass.setBindGroup(0, bg);
  pass.dispatchWorkgroups(Math.ceil(input.length / 64));
  pass.end();
  enc.copyBufferToBuffer(buf, 0, readback, 0, input.byteLength);
  device.queue.submit([enc.finish()]);
  const err = await device.popErrorScope();
  if (err) throw new Error('validation error: ' + err.message);
  await readback.mapAsync(GPUMapMode.READ);
  const result = new Float32Array(readback.getMappedRange().slice(0));
  const bad = result.findIndex((v, i) => v !== input[i] * 2 + 1);
  if (bad !== -1) throw new Error(`compute result wrong at ${bad}: got ${result[bad]}, expected ${input[bad] * 2 + 1}`);
  log(`compute: ${input.length} values doubled-plus-one on the GPU, all correct`);
  finish(true, 'WebGPU works: adapter found and a compute shader ran correctly.');
} catch (e) {
  finish(false, String(e && e.message || e));
}
</script>
</body>
</html>
