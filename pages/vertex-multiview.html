<!doctype html>
<meta charset="utf-8">
<title>Hit vertex positions and multiview test</title>
<style>body { font: 14px/1.5 system-ui, sans-serif; margin: 16px; } pre { white-space: pre-wrap; }</style>
<h1>Hit vertex positions and multiview test</h1>
<p>Ray-hit vertex return: a ray query reads the hit triangle's three vertex positions from the acceleration
structure. Multiview: one draw renders both layers of a 2-layer texture, each view writing its own colour. Results are
also printed as <code>MULTI ...</code> lines.</p>
<pre id="out"></pre>
<script type="module">
const out = document.getElementById("out");
const log = (line) => { out.textContent += line + "\n"; console.log("MULTI " + line); };
let device;

async function read(buffer, size) {
  const readback = device.createBuffer({ size, usage: GPUBufferUsage.MAP_READ | GPUBufferUsage.COPY_DST });
  const encoder = device.createCommandEncoder();
  encoder.copyBufferToBuffer(buffer, 0, readback, 0, size);
  device.queue.submit([encoder.finish()]);
  await readback.mapAsync(GPUMapMode.READ);
  const copy = readback.getMappedRange().slice(0);
  readback.unmap();
  return copy;
}

async function vertexReturn() {
  const vertices = new Float32Array([-1, -1, 0, 1, -1, 0, 0, 1, 0]);
  const vertexBuffer = device.createBuffer({ size: vertices.byteLength, usage: GPUBufferUsage.BLAS_INPUT | GPUBufferUsage.COPY_DST });
  device.queue.writeBuffer(vertexBuffer, 0, vertices);
  const blas = device.createBlas({ geometries: [{ vertexFormat: "float32x3", vertexCount: 3 }], allowVertexReturn: true });
  const tlas = device.createTlas({ maxInstances: 1, allowVertexReturn: true });
  const encoder = device.createCommandEncoder();
  encoder.buildAccelerationStructures([{ blas, geometries: [{ vertexBuffer, vertexStride: 12 }] }], [{ tlas, instances: [{ blas }] }]);
  device.queue.submit([encoder.finish()]);

  const module = device.createShaderModule({ code: `
enable wgpu_ray_query;
enable wgpu_ray_query_vertex_return;
@group(0) @binding(0) var acc: acceleration_structure<vertex_return>;
@group(0) @binding(1) var<storage, read_write> o: array<vec4f, 3>;
@compute @workgroup_size(1) fn main() {
  var rq: ray_query<vertex_return>;
  rayQueryInitialize(&rq, acc, RayDesc(0u, 0xffu, 0.001, 100.0, vec3f(0.1, -0.2, 1.0), vec3f(0.0, 0.0, -1.0)));
  rayQueryProceed(&rq);
  let p = getCommittedHitVertexPositions(&rq);
  o[0] = vec4f(p[0], 1.0);
  o[1] = vec4f(p[1], 1.0);
  o[2] = vec4f(p[2], 1.0);
}` });
  for (const m of (await module.getCompilationInfo()).messages) log(`vertex return shader ${m.type}: ${m.message}`);
  const layout = device.createBindGroupLayout({ entries: [
    { binding: 0, visibility: GPUShaderStage.COMPUTE, accelerationStructure: { vertexReturn: true } },
    { binding: 1, visibility: GPUShaderStage.COMPUTE, buffer: { type: "storage" } },
  ] });
  const output = device.createBuffer({ size: 48, usage: GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_SRC });
  const pipeline = device.createComputePipeline({ layout: device.createPipelineLayout({ bindGroupLayouts: [layout] }), compute: { module, entryPoint: "main" } });
  const group = device.createBindGroup({ layout, entries: [{ binding: 0, resource: tlas }, { binding: 1, resource: { buffer: output } }] });
  const run = device.createCommandEncoder();
  const pass = run.beginComputePass();
  pass.setPipeline(pipeline); pass.setBindGroup(0, group); pass.dispatchWorkgroups(1); pass.end();
  device.queue.submit([run.finish()]);
  const v = Array.from(new Float32Array(await read(output, 48)));
  const got = [v.slice(0, 3), v.slice(4, 7), v.slice(8, 11)].map((p) => p.join(",")).join(" | ");
  const ok = got === "-1,-1,0 | 1,-1,0 | 0,1,0";
  return [ok, `hit triangle vertices ${got}`];
}

async function multiview() {
  const SIZE = 16;
  const texture = device.createTexture({ size: [SIZE, SIZE, 2], format: "rgba8unorm", usage: GPUTextureUsage.RENDER_ATTACHMENT | GPUTextureUsage.COPY_SRC });
  const module = device.createShaderModule({ code: `
@vertex fn vs(@builtin(vertex_index) i: u32) -> @builtin(position) vec4f {
  let p = array(vec2f(-1.0, -1.0), vec2f(3.0, -1.0), vec2f(-1.0, 3.0));
  return vec4f(p[i], 0.0, 1.0);
}
@fragment fn fs(@builtin(view_index) view: u32) -> @location(0) vec4f {
  return select(vec4f(1.0, 0.0, 0.0, 1.0), vec4f(0.0, 1.0, 0.0, 1.0), view == 1u);
}` });
  for (const m of (await module.getCompilationInfo()).messages) log(`multiview shader ${m.type}: ${m.message}`);
  const pipeline = device.createRenderPipeline({ layout: "auto", vertex: { module, entryPoint: "vs" }, fragment: { module, entryPoint: "fs", targets: [{ format: "rgba8unorm" }] }, multiviewMask: 3 });
  const encoder = device.createCommandEncoder();
  const pass = encoder.beginRenderPass({ colorAttachments: [{ view: texture.createView({ dimension: "2d-array" }), loadOp: "clear", storeOp: "store", clearValue: [0, 0, 0, 0] }], multiviewMask: 3 });
  pass.setPipeline(pipeline);
  pass.draw(3);
  pass.end();
  const buffer = device.createBuffer({ size: 256 * SIZE * 2, usage: GPUBufferUsage.COPY_DST | GPUBufferUsage.COPY_SRC });
  encoder.copyTextureToBuffer({ texture }, { buffer, bytesPerRow: 256, rowsPerImage: SIZE }, [SIZE, SIZE, 2]);
  device.queue.submit([encoder.finish()]);
  const bytes = new Uint8Array(await read(buffer, 256 * SIZE * 2));
  const layer0 = bytes.slice(256 * 5 + 4 * 5, 256 * 5 + 4 * 5 + 4).join(",");
  const layer1 = bytes.slice(256 * SIZE + 256 * 5 + 4 * 5, 256 * SIZE + 256 * 5 + 4 * 5 + 4).join(",");
  return [layer0 === "255,0,0,255" && layer1 === "0,255,0,255", `layer 0 ${layer0}, layer 1 ${layer1} from one draw`];
}

try {
  const adapter = await navigator.gpu.requestAdapter();
  const wanted = ["experimental-ray-query", "wgpu-ray-hit-vertex-return", "wgpu-multiview", "wgpu-selective-multiview", "wgpu-mesh-shader-multiview"];
  const offered = wanted.filter((f) => adapter.features.has(f));
  log(`offered: ${offered.join(", ")}; adapter features ${adapter.features.size}`);
  device = await adapter.requestDevice({ requiredFeatures: offered });
  device.addEventListener("uncapturederror", (e) => log(`uncaptured error: ${e.error.message.slice(0, 300)}`));
  for (const [name, test] of [["wgpu-ray-hit-vertex-return", vertexReturn], ["wgpu-multiview", multiview]]) {
    if (!device.features.has(name)) { log(`${name} SKIP (not offered)`); continue; }
    device.pushErrorScope("validation");
    try {
      const [ok, detail] = await test();
      const error = await device.popErrorScope();
      log(`${name} ${error ? "FAIL " + error.message.slice(0, 300) : ok ? "PASS" : "FAIL"} ${detail}`);
    } catch (e) {
      await device.popErrorScope();
      log(`${name} FAIL ${e.message}`);
    }
  }
  log("DONE");
} catch (error) {
  log(`ERROR ${error?.message ?? error}`);
  log("DONE");
}
</script>
